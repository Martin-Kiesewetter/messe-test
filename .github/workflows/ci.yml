name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Frontend build
        working-directory: apps/frontend
        run: |
          npm ci
          npm run build

      - name: Backend build
        working-directory: apps/backend
        run: |
          npm ci
          npm run build
