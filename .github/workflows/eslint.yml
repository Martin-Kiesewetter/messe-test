name: ESLint

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/frontend/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/frontend/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: cd apps/frontend && npm ci
      
      - name: Run ESLint
        run: cd apps/frontend && npm run lint
